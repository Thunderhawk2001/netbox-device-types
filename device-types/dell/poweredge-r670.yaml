# Dell PowerEdge R670 - Beispiel-Template
# Quelle: Dell PowerEdge R670 Data Sheet
# https://www.dell.com/support/home/product/poweredge_r670

manufacturer: Dell
model: PowerEdge R670
slug: dell-poweredge-r670
u_height: 1
is_full_depth: true
airflow: front-to-rear
weight: 12.5
weight_unit: kg

# Console Ports
console-ports:
  - name: Serial
    type: db-9
  - name: USB Console
    type: usb-micro-ab

# Management Interface
interfaces:
  - name: iDRAC9
    type: 1000base-t
    mgmt_only: true
  - name: eth0
    type: 1000base-t
  - name: eth1
    type: 1000base-t
  - name: eth2
    type: 1000base-t
  - name: eth3
    type: 1000base-t

# Power Ports (PSU-Typ aus Datenblatt verifizieren!)
# PSU-Teilenummer: Dell 450-AEVM (C20, 16A)
power-ports:
  - name: PSU 1
    type: iec-60320-c20
    maximum_draw: 750
  - name: PSU 2
    type: iec-60320-c20
    maximum_draw: 750

# Module Bays (falls vorhanden)
module-bays:
  - name: NIC Slot 1
  - name: NIC Slot 2
  - name: NIC Slot 3
