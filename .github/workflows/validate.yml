name: Validate YAML

on:
  push:
    branches:
      - main
    paths:
      - 'device-types/**/*.yaml'
      - '.yamllint.yml'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'device-types/**/*.yaml'
      - '.yamllint.yml'
      - '.github/workflows/validate.yml'

jobs:
  yamllint:
    name: Validate added and modified YAML templates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yamllint
        run: pip install yamllint

      - name: Identify added and modified YAML templates
        id: changed-yaml
        shell: bash
        run: |
          files="$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'device-types/**/*.yaml')"
          {
            echo 'files<<EOF'
            echo "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate added and modified YAML templates
        if: steps.changed-yaml.outputs.files != ''
        shell: bash
        run: |
          printf '%s\n' "${{ steps.changed-yaml.outputs.files }}" | xargs yamllint
